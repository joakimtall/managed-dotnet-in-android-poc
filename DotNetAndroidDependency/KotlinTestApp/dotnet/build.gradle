apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

def dotnetAppPath = file('../../DotNetAndroidApp')
def dotnetBuildPath = file('../../DotNetAndroidApp/obj/Release/net9.0-android')
def dotnetApkPath = file('../../DotNetAndroidApp/bin/Release/net9.0-android/com.companyname.DotNetAndroidApp-Signed.apk')

def dotnetRoot = System.getenv("DOTNET_ROOT")
if (!dotnetRoot) {
    // Default install locations for dotnet
    if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
        dotnetRoot = "/usr/local/share/dotnet"
    } else if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
        dotnetRoot = System.getenv("ProgramFiles") + "\\dotnet"
    } else {
        dotnetRoot = System.getenv("HOME") + "/.dotnet"
    }
}

def javaRuntimeJarCandidates = fileTree("$dotnetRoot/packs") {
    include "**/java_runtime_net6.jar"
}.files

if (javaRuntimeJarCandidates.empty) {
    throw new GradleException("Unable to locate java_runtime_net6.jar under $dotnetRoot/packs. Ensure .NET Android workload is installed.")
}

def javaRuntimeJar = javaRuntimeJarCandidates.max { it.lastModified() }

def cryptoRuntimeJarCandidates = fileTree("$dotnetRoot/packs") {
    include "Microsoft.NETCore.App.Runtime.Mono.android-*/**/libSystem.Security.Cryptography.Native.Android.jar"
}.files

if (cryptoRuntimeJarCandidates.empty) {
    throw new GradleException("Unable to locate libSystem.Security.Cryptography.Native.Android.jar under $dotnetRoot/packs. Ensure .NET Android workload is installed.")
}

def cryptoRuntimeJar = cryptoRuntimeJarCandidates.max { it.lastModified() }

android {
    namespace 'com.example.kotlindotnettestapp.dotnet'
    compileSdkVersion project.compileSdkVersion
    defaultConfig {
        minSdkVersion project.minSdkVersion
        targetSdkVersion project.targetSdkVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
            jniLibs.srcDirs = ['build/generated/dotnet/jniLibs']
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    api files('libs/mono.android.jar')
    api files('libs/mono-classes.jar')
    api files('libs/java_runtime_net6.jar')
    api files('libs/libSystem.Security.Cryptography.Native.Android.jar')
}

task buildDotNetApp(type: Exec) {
    description = 'Build the .NET Android app to generate bindings and native artifacts'
    workingDir dotnetAppPath
    commandLine 'dotnet', 'build', 'DotNetAndroidApp.csproj', '-c', 'Release'
}

task copyMonoAndroidJar(type: Copy) {
    description = 'Copy mono.android.jar from .NET build'
    dependsOn buildDotNetApp
    from "${dotnetBuildPath}/android/bin/mono.android.jar"
    into 'libs'
}

task copyDotNetClassesJar(type: Copy) {
    description = 'Copy compiled Java classes from .NET build'
    dependsOn buildDotNetApp
    from "${dotnetBuildPath}/android/bin/classes.zip"
    into 'libs'
    rename { 'mono-classes.jar' }
}

task copyJavaRuntimeJar(type: Copy) {
    description = 'Copy Java runtime stub classes required by Mono runtime'
    from javaRuntimeJar
    into 'libs'
    rename { 'java_runtime_net6.jar' }
}

task copyCryptoRuntimeJar(type: Copy) {
    description = 'Copy crypto helper classes required by Mono runtime'
    from cryptoRuntimeJar
    into 'libs'
    rename { 'libSystem.Security.Cryptography.Native.Android.jar' }
}

task extractDotNetNativeLibs(type: Copy) {
    description = 'Extract native libraries from .NET APK'
    dependsOn copyMonoAndroidJar

    from(zipTree(dotnetApkPath)) {
        include 'lib/**/*.so'
        eachFile { fcd ->
            fcd.relativePath = new RelativePath(true, fcd.relativePath.segments.drop(1))
        }
    }
    into 'build/generated/dotnet/jniLibs'
    includeEmptyDirs = false
}

task prepareDotNetDependencies {
    description = 'Prepare all .NET dependencies'
    dependsOn copyMonoAndroidJar, copyDotNetClassesJar, copyJavaRuntimeJar, copyCryptoRuntimeJar, extractDotNetNativeLibs
}

preBuild.dependsOn prepareDotNetDependencies

afterEvaluate {
    tasks.matching { task ->
        task.name.startsWith('compile') && task.name.contains('Java')
    }.configureEach {
        dependsOn prepareDotNetDependencies
    }
}
